  /v1/internal/ingest:
    post:
      operationId: runIngestion
      summary: Ingests the B2C activity into the analytics database (Cloud Scheduler
        only)
      tags:
        - internal
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                  - runId
                  - startedAt
                  - durationMs
                  - valuation
                  - phasesMs
                  - sources
                  - aggregates
                properties:
                  status:
                    type: string
                    enum:
                      - completed
                      - partial
                      - locked
                  runId:
                    type: string
                  startedAt:
                    type: string
                    format: date-time
                  durationMs:
                    type: integer
                    minimum: 0
                  valuation:
                    type: string
                    enum:
                      - market
                      - none
                  phasesMs:
                    type: object
                    additionalProperties: false
                    required:
                      - copyTransactions
                      - revisit
                      - catalogUsers
                      - prices
                      - snapshot
                      - polymarket
                      - aggregateRebuild
                      - persist
                    properties:
                      copyTransactions:
                        type: integer
                        minimum: 0
                      revisit:
                        type: integer
                        minimum: 0
                      catalogUsers:
                        type: integer
                        minimum: 0
                      prices:
                        type: integer
                        minimum: 0
                      snapshot:
                        type: integer
                        minimum: 0
                      polymarket:
                        type: integer
                        minimum: 0
                      aggregateRebuild:
                        type: integer
                        minimum: 0
                      persist:
                        type: integer
                        minimum: 0
                  sources:
                    type: object
                    additionalProperties: false
                    required:
                      - transactions
                      - users
                      - catalog
                      - prices
                      - balances
                      - polymarket
                    properties:
                      transactions:
                        type: object
                        additionalProperties: false
                        required:
                          - read
                          - revisited
                          - lastId
                        properties:
                          read:
                            type: integer
                            minimum: 0
                          revisited:
                            type: integer
                            minimum: 0
                          lastId:
                            type:
                              - "null"
                              - string
                      users:
                        type: object
                        additionalProperties: false
                        required:
                          - read
                          - newWallets
                          - countedInCountries
                          - polymarketAccounts
                        properties:
                          read:
                            type: integer
                            minimum: 0
                          newWallets:
                            type: integer
                            minimum: 0
                          countedInCountries:
                            type: integer
                            minimum: 0
                          polymarketAccounts:
                            type: integer
                            minimum: 0
                      catalog:
                        type: object
                        additionalProperties: false
                        required:
                          - tokens
                          - networks
                          - retainedTokens
                          - retainedNetworks
                        properties:
                          tokens:
                            type: integer
                            minimum: 0
                          networks:
                            type: integer
                            minimum: 0
                          retainedTokens:
                            type: integer
                            minimum: 0
                          retainedNetworks:
                            type: integer
                            minimum: 0
                      prices:
                        type: object
                        additionalProperties: false
                        required:
                          - provider
                          - calls
                          - prices
                          - failed
                        properties:
                          provider:
                            type:
                              - "null"
                              - string
                          calls:
                            type: integer
                            minimum: 0
                          prices:
                            type: integer
                            minimum: 0
                          failed:
                            type: boolean
                      balances:
                        type: object
                        additionalProperties: false
                        required:
                          - status
                          - calls
                          - failedCalls
                          - networks
                          - masterWallets
                        properties:
                          status:
                            type: string
                            enum:
                              - complete
                              - partial
                              - failed
                              - disabled
                          calls:
                            type: integer
                            minimum: 0
                          failedCalls:
                            type: integer
                            minimum: 0
                          networks:
                            type: array
                            items:
                              type: object
                              additionalProperties: false
                              required:
                                - network
                                - chainId
                                - status
                                - wallets
                                - walletsRead
                                - calls
                                - plannedCalls
                                - failedCalls
                                - b2cEnabled
                                - analyticsVisible
                                - collectBalances
                                - endpointPresent
                                - attempted
                                - reason
                                - native
                                - unpricedAssets
                                - startedAt
                                - finishedAt
                                - durationMs
                                - takenAt
                                - lastSuccessAt
                              properties:
                                network:
                                  type: string
                                chainId:
                                  type: string
                                status:
                                  type: string
                                  enum:
                                    - complete
                                    - partial
                                    - failed
                                    - unsupported
                                wallets:
                                  type: integer
                                  minimum: 0
                                walletsRead:
                                  type: integer
                                  minimum: 0
                                calls:
                                  type: integer
                                  minimum: 0
                                plannedCalls:
