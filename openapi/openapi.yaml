  /v1/metrics/overview:
    get:
      operationId: getOverviewMetrics
      summary: "Overview dataset: volume, fees, users, TVL, top tokens, countries and
        products"
      tags:
        - metrics
      parameters:
        - schema:
            type: string
            pattern: ^all$|^(?!all$)[a-z0-9]+(-[a-z0-9]+)*$
            maxLength: 64
            default: all
          in: query
          name: network
          required: false
        - schema:
            type: string
            enum:
              - today
              - week
              - month
              - year
              - ytd
              - all
            default: month
          in: query
          name: range
          required: false
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - meta
                  - tiles
                  - series
                  - byNetwork
                  - valuation
                  - tvl
                  - topTokens
                  - tradedTokens
                  - topCountries
                  - volumeByProduct
                properties:
                  meta:
                    type: object
                    additionalProperties: false
                    required:
                      - datasetVersion
                      - dataStatus
                      - lastUpdatedAt
                      - ingest
                      - generatedAt
                      - currency
                      - network
                      - range
                      - tokenScope
                      - period
                      - previousPeriod
                      - bucket
                    properties:
                      datasetVersion:
                        type: string
                      dataStatus:
                        type: string
                        enum:
                          - mock
                          - mixed
                          - live
                      lastUpdatedAt:
                        anyOf:
                          - type: string
                            format: date-time
                          - type: "null"
                      ingest:
                        anyOf:
                          - type: object
                            additionalProperties: false
                            required:
                              - status
                              - finishedAt
                              - sources
                              - valuation
                            properties:
                              status:
                                type: string
                                enum:
                                  - completed
                                  - partial
                              finishedAt:
                                type: string
                                format: date-time
