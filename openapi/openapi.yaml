  /v1/internal/ingest:
    post:
      operationId: runIngestion
      summary: Ingests the B2C activity into the analytics database (Cloud Scheduler
        only)
      tags:
        - internal
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                  - startedAt
                  - durationMs
                  - sources
                  - aggregates
                properties:
                  status:
                    type: string
                    enum:
                      - completed
                      - partial
                      - locked
                  startedAt:
                    type: string
                    format: date-time
                  durationMs:
                    type: integer
                    minimum: 0
                  sources:
                    type: object
                    additionalProperties: false
                    required:
                      - transactions
                      - users
                      - catalog
                      - prices
                    properties:
                      transactions:
                        type: object
                        additionalProperties: false
                        required:
                          - read
                          - revisited
                          - lastId
                        properties:
                          read:
                            type: integer
                            minimum: 0
                          revisited:
                            type: integer
                            minimum: 0
                          lastId:
                            type:
                              - "null"
                              - string
                      users:
                        type: object
                        additionalProperties: false
                        required:
                          - read
                        properties:
                          read:
                            type: integer
                            minimum: 0
                      catalog:
                        type: object
                        additionalProperties: false
                        required:
                          - tokens
                          - networks
                        properties:
                          tokens:
                            type: integer
                            minimum: 0
                          networks:
                            type: integer
                            minimum: 0
                      prices:
                        type: object
                        additionalProperties: false
                        required:
                          - provider
                          - calls
                          - prices
                          - failed
                        properties:
                          provider:
                            type:
                              - "null"
                              - string
                          calls:
                            type: integer
                            minimum: 0
                          prices:
                            type: integer
                            minimum: 0
                          failed:
                            type: boolean
                  aggregates:
                    anyOf:
                      - type: object
                        additionalProperties: false
                        required:
                          - transfers
                          - swaps
                          - unpriced
                          - outsideCatalog
                          - users
                          - builtAt
                        properties:
                          transfers:
                            type: integer
                            minimum: 0
                          swaps:
                            type: integer
                            minimum: 0
                          unpriced:
                            type: integer
                            minimum: 0
                          outsideCatalog:
                            type: integer
                            minimum: 0
                          users:
                            type: integer
                            minimum: 0
                          builtAt:
                            type: string
                            format: date-time
                      - type: "null"
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
