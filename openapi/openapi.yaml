                                    type: string
                                    enum:
                                      - complete
                                      - failed
                                      - skipped
                                      - disabled
                                  balances:
                                    type: string
                                    enum:
                                      - complete
                                      - partial
                                      - failed
                                      - disabled
                                  polymarket:
                                    type: string
                                    enum:
                                      - complete
                                      - partial
                                      - failed
                                      - disabled
                              valuation:
                                type: string
                                enum:
                                  - market
                                  - none
                          - type: "null"
                      generatedAt:
                        type: string
                        format: date-time
                      currency:
                        type: string
                        enum:
                          - USD
                      network:
                        type: string
                        pattern: ^all$|^(?!all$)[a-z0-9]+(-[a-z0-9]+)*$
                        maxLength: 64
                      range:
                        type: string
                        enum:
                          - today
                          - week
                          - month
                          - year
                          - ytd
                          - all
                      tokenScope:
                        type: object
                        additionalProperties: false
                        required:
                          - hidden
                          - operationCounts
                        properties:
                          hidden:
                            type: array
                            items:
                              type: object
                              additionalProperties: false
                              required:
                                - network
                                - asset
                              properties:
                                network:
                                  type: string
                                  pattern: ^(?!all$)[a-z0-9]+(-[a-z0-9]+)*$
                                  maxLength: 64
                                asset:
                                  type: string
                          operationCounts:
                            type: string
                            enum:
