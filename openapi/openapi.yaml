            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - meta
                  - tiles
                  - series
                  - byNetwork
                  - byAsset
                properties:
                  meta:
                    type: object
                    additionalProperties: false
                    required:
                      - datasetVersion
                      - dataStatus
                      - generatedAt
                      - currency
                      - network
                      - range
