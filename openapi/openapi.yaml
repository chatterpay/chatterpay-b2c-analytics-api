openapi: 3.1.0
info:
  title: ChatterPay Analytics API
  version: 0.1.0
  description: Private API behind the ChatterPay Analytics site BFF. Cloud Run
    only admits callers with an IAM identity token of the site or the scheduler
    service account, whose audience is the API domain. Metrics come from the
    aggregates of the analytics database, which the scheduler refreshes through
    the ingestion endpoint; meta.dataStatus tells live, mixed and mock values
    apart.
components:
  schemas:
    ApiError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - requestId
      properties:
        code:
          type: string
          enum:
            - BAD_REQUEST
            - UNAUTHORIZED
            - FORBIDDEN
            - CANNOT_CHANGE_OWN_ROLE
            - CANNOT_REMOVE_SELF
            - CANNOT_BLOCK_SELF
            - MEMBER_BLOCKED
            - NOT_FOUND
            - CONFLICT
            - CONFIG_CONFLICT
            - LAST_ENABLED_NETWORK
            - PAYLOAD_TOO_LARGE
            - RATE_LIMITED
            - SERVICE_UNAVAILABLE
            - INTERNAL_ERROR
        message:
          type: string
          description: Caller-safe description; never contains secrets, codes or PII.
        requestId:
          type: string
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness probe
      tags:
        - infrastructure
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                      - unavailable
  /readyz:
    get:
      operationId: getReadiness
      summary: "Readiness probe: the process and the store answer"
      tags:
        - infrastructure
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                      - unavailable
        "503":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                      - unavailable
  /v1/auth/request-code:
    post:
      operationId: requestLoginCode
      summary: Open a login challenge for an email; answers the same for unknown emails
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                locale:
                  type: string
                  enum:
                    - en
                    - es
                    - br
                  description: Language of the email (`br` is Brazilian Portuguese); `en` when
                    omitted.
      responses:
        "202":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - challengeId
                  - expiresAt
                  - delivery
                  - codeLength
                properties:
                  challengeId:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
                  delivery:
                    type: string
                    enum:
                      - email
                      - access_code
                    description: "`email`: a code is emailed to members and invited emails, and the
                      answer is the same for any other email. `access_code`: a
                      demo account, which signs in with the shared demo code."
                  codeLength:
                    type:
                      - "null"
                      - integer
                    description: Digits of the emailed code; `null` with `access_code`.
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/auth/verify-code:
    post:
      operationId: verifyLoginCode
      summary: Exchange a challenge and its code for a session token
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - challengeId
                - email
                - code
              properties:
                challengeId:
                  type: string
                  minLength: 1
                  maxLength: 64
                email:
                  type: string
                  format: email
                  maxLength: 254
                code:
                  type: string
                  minLength: 6
                  maxLength: 64
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - token
                  - expiresAt
                  - user
                properties:
                  token:
                    type: string
                    description: "Session JWT (EdDSA) for `Authorization: Bearer`."
                  expiresAt:
                    type: string
                    format: date-time
                  user:
                    type: object
                    additionalProperties: false
                    required:
                      - id
                      - email
                      - name
                      - role
                      - status
                      - blockedAt
                      - createdAt
                      - lastLoginAt
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                      name:
                        type:
                          - "null"
                          - string
                        description: Name recorded for the member by an operator; null when none. Never
                          derived.
                      role:
                        type: string
                        enum:
                          - admin
                          - viewer
                      status:
                        type: string
                        enum:
                          - active
                          - blocked
                        description: "`blocked`: an admin blocked the member, who cannot sign in and
                          whose sessions were revoked, until an admin unblocks
                          it."
                      blockedAt:
                        type:
                          - "null"
                          - string
                        format: date-time
                      createdAt:
                        type: string
                        format: date-time
                      lastLoginAt:
                        type:
                          - "null"
                          - string
                        format: date-time
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/auth/me:
    get:
      operationId: getCurrentSession
      summary: Member and session behind the bearer token
      tags:
        - auth
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - user
                  - session
                properties:
                  user:
                    type: object
                    additionalProperties: false
                    required:
                      - id
                      - email
                      - name
                      - role
                      - status
                      - blockedAt
                      - createdAt
                      - lastLoginAt
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                      name:
                        type:
                          - "null"
                          - string
                        description: Name recorded for the member by an operator; null when none. Never
                          derived.
                      role:
                        type: string
                        enum:
                          - admin
                          - viewer
                      status:
                        type: string
                        enum:
                          - active
                          - blocked
                        description: "`blocked`: an admin blocked the member, who cannot sign in and
                          whose sessions were revoked, until an admin unblocks
                          it."
                      blockedAt:
                        type:
                          - "null"
                          - string
                        format: date-time
                      createdAt:
                        type: string
                        format: date-time
                      lastLoginAt:
                        type:
                          - "null"
                          - string
                        format: date-time
                  session:
                    type: object
                    additionalProperties: false
                    required:
                      - expiresAt
                    properties:
                      expiresAt:
                        type: string
                        format: date-time
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the session behind the bearer token
      tags:
        - auth
      responses:
        "204":
          description: Session revoked
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/team/members:
    get:
      operationId: listTeamMembers
      summary: Active members, blocked ones included, sorted by email
      tags:
        - team
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                        - id
                        - email
                        - name
                        - role
                        - status
                        - blockedAt
                        - createdAt
                        - lastLoginAt
                        - lastActivityAt
                        - loginLockedUntil
                      properties:
                        id:
                          type: string
                        email:
                          type: string
                        name:
                          type:
                            - "null"
                            - string
                          description: Name recorded for the member by an operator; null when none. Never
                            derived.
                        role:
                          type: string
                          enum:
                            - admin
                            - viewer
                        status:
                          type: string
                          enum:
                            - active
                            - blocked
                          description: "`blocked`: an admin blocked the member, who cannot sign in and
                            whose sessions were revoked, until an admin unblocks
                            it."
                        blockedAt:
                          type:
                            - "null"
                            - string
                          format: date-time
                        createdAt:
                          type: string
                          format: date-time
                        lastLoginAt:
                          type:
                            - "null"
                            - string
                          format: date-time
                        lastActivityAt:
                          type:
                            - "null"
                            - string
                          format: date-time
                          description: Last event of the activity log the member acted in, of any action;
                            distinct from lastLoginAt.
                        loginLockedUntil:
                          type:
                            - "null"
                            - string
                          format: date-time
                          description: End of the automatic lockout of login codes for the email after
                            repeated codes without a login; null when none. It
                            ends by itself and is never an admin block.
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/team/invites:
    get:
      operationId: listTeamInvites
      summary: Invites of one view, newest first, one page per cursor, with the count
        of each view
      tags:
        - team
      parameters:
        - schema:
            type: string
            enum:
              - pending
              - history
            default: pending
          in: query
          name: view
          required: false
          description: "`pending`: invites that can still be resent, revoked or accepted.
            `history`: accepted, revoked and expired invites."
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
          in: query
          name: limit
          required: false
        - schema:
            type: string
            minLength: 1
            maxLength: 200
            pattern: ^[A-Za-z0-9_-]+$
          in: query
          name: cursor
          required: false
          description: Opaque `nextCursor` of the previous page of the same view; omitted
            for the first page.
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - items
                  - nextCursor
                  - counts
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                        - id
                        - email
                        - role
                        - status
                        - createdAt
                        - expiresAt
                        - resendCount
                        - lastSentAt
                        - createdBy
                        - delivery
                      properties:
                        id:
                          type: string
                        email:
                          type: string
                        role:
                          type: string
                          enum:
                            - admin
                            - viewer
                        status:
                          type: string
                          enum:
                            - created
                            - simulated
                            - accepted
                            - revoked
                            - expired
                        createdAt:
                          type: string
                          format: date-time
                        expiresAt:
                          type: string
                          format: date-time
                        resendCount:
                          type: integer
                          minimum: 0
                        lastSentAt:
                          type:
                            - "null"
                            - string
                          format: date-time
                        createdBy:
                          type: string
                          description: Email of the admin that created the invite.
                        delivery:
                          type: object
                          additionalProperties: false
                          required:
                            - state
                            - attempts
                            - lastAttemptAt
                            - failure
                          properties:
                            state:
                              type: string
                              enum:
                                - pending
                                - simulated
                                - sent
                                - failed
                              description: "Last send of the invite: `pending` while it runs, or when it was
                                cut short; `simulated` when no email was sent;
                                `sent` when the email provider accepted the
                                message; `failed` when it refused it or did not
                                answer after the retries."
                            attempts:
                              type: integer
                              minimum: 0
                            lastAttemptAt:
                              type:
                                - "null"
                                - string
                              format: date-time
                            failure:
                              type:
                                - "null"
                                - string
                              enum:
                                - rejected
                                - rate_limited
                                - unavailable
                                - network
                                - null
                              description: Cause of a `failed` delivery; `null` otherwise.
                          description: Delivery of the last email of the invite, from its creation or its
                            last resend.
                  nextCursor:
                    type:
                      - "null"
                      - string
                    description: Cursor of the next page, for the `cursor` parameter; `null` on the
                      last page.
                  counts:
                    type: object
                    additionalProperties: false
                    required:
                      - pending
                      - history
                    properties:
                      pending:
                        type: integer
                        minimum: 0
                      history:
                        type: integer
                        minimum: 0
                    description: Invites of each view at the time of the request, whatever page was
                      asked.
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createTeamInvite
      summary: Invite an email with a role and email the invitation, idempotent by
        mutationId
      tags:
        - team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - email
                - role
                - mutationId
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                role:
                  type: string
                  enum:
                    - admin
                    - viewer
                mutationId:
                  type: string
                  format: uuid
                locale:
                  type: string
                  enum:
                    - en
                    - es
                    - br
                  description: Language of the email (`br` is Brazilian Portuguese); `en` when
                    omitted.
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - id
                  - email
                  - role
                  - status
                  - createdAt
                  - expiresAt
                  - resendCount
                  - lastSentAt
                  - createdBy
                  - delivery
                properties:
                  id:
                    type: string
                  email:
                    type: string
                  role:
                    type: string
                    enum:
                      - admin
                      - viewer
                  status:
                    type: string
                    enum:
                      - created
                      - simulated
                      - accepted
                      - revoked
                      - expired
                  createdAt:
                    type: string
                    format: date-time
                  expiresAt:
                    type: string
                    format: date-time
                  resendCount:
                    type: integer
                    minimum: 0
                  lastSentAt:
                    type:
                      - "null"
                      - string
                    format: date-time
                  createdBy:
                    type: string
                    description: Email of the admin that created the invite.
                  delivery:
                    type: object
                    additionalProperties: false
                    required:
                      - state
                      - attempts
                      - lastAttemptAt
                      - failure
                    properties:
                      state:
                        type: string
                        enum:
                          - pending
                          - simulated
                          - sent
                          - failed
                        description: "Last send of the invite: `pending` while it runs, or when it was
                          cut short; `simulated` when no email was sent; `sent`
                          when the email provider accepted the message; `failed`
                          when it refused it or did not answer after the
                          retries."
                      attempts:
                        type: integer
                        minimum: 0
                      lastAttemptAt:
                        type:
                          - "null"
                          - string
                        format: date-time
                      failure:
                        type:
                          - "null"
                          - string
                        enum:
                          - rejected
                          - rate_limited
                          - unavailable
                          - network
                          - null
                        description: Cause of a `failed` delivery; `null` otherwise.
                    description: Delivery of the last email of the invite, from its creation or its
                      last resend.
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/team/activity:
    get:
      operationId: listTeamActivity
      summary: Login and team management events, newest first, one page per cursor
      tags:
        - team
      parameters:
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          in: query
          name: limit
          required: false
        - schema:
            type: string
            minLength: 1
            maxLength: 200
            pattern: ^[A-Za-z0-9_-]+$
          in: query
          name: cursor
          required: false
          description: Opaque `nextCursor` of the previous page; omitted for the first page.
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - items
                  - nextCursor
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                        - id
                        - at
                        - actor
                        - action
                        - target
                        - outcome
                        - client
                      properties:
                        id:
                          type: string
                        at:
                          type: string
                          format: date-time
                        actor:
                          type:
                            - "null"
                            - string
                          description: Email of the member that acted.
                        action:
                          type: string
                          enum:
                            - login
                            - login_failed
                            - logout
                            - invite_created
                            - invite_resent
                            - invite_revoked
                            - invite_accepted
                            - role_changed
                            - member_removed
                            - member_blocked
                            - member_unblocked
                            - login_lockout_cleared
                            - network_hidden
                            - network_shown
                            - token_hidden
                            - token_shown
                        target:
                          type:
                            - "null"
                            - string
                          description: Email the action applies to, the network as "Label (chainId)" or
                            the token as "SYMBOL on Label (tokenId)".
                        outcome:
                          type: string
                          enum:
                            - success
                            - failure
                        client:
                          anyOf:
                            - type: object
                              additionalProperties: false
                              required:
                                - ip
                                - userAgent
                                - language
                                - platform
                                - mobile
                                - brands
                                - browser
                                - os
                                - device
                                - expiresAt
                              properties:
                                ip:
                                  type:
                                    - string
                                    - "null"
                                  description: Browser IP forwarded by the BFF.
                                userAgent:
                                  type:
                                    - string
                                    - "null"
                                  description: User-Agent of the browser.
                                language:
                                  type:
                                    - string
                                    - "null"
                                  description: Accept-Language of the browser.
                                platform:
                                  type:
                                    - string
                                    - "null"
                                  description: Sec-CH-UA-Platform client hint.
                                mobile:
                                  type:
                                    - boolean
                                    - "null"
                                  description: Sec-CH-UA-Mobile client hint.
                                brands:
                                  type:
                                    - string
                                    - "null"
                                  description: Sec-CH-UA client hint.
                                browser:
                                  type:
                                    - string
                                    - "null"
                                  description: Browser and major version read from the user agent and client
                                    hints.
                                os:
                                  type:
                                    - string
                                    - "null"
                                  description: Operating system read from the same.
                                device:
                                  type:
                                    - string
                                    - "null"
                                  enum:
                                    - desktop
                                    - mobile
                                    - tablet
                                    - bot
                                    - null
                                  description: Kind of device read from the same.
                                expiresAt:
                                  type: string
                                  format: date-time
                                  description: When the browser data is removed from the event; the event stays.
                            - type: "null"
                          description: Browser of the request, kept 60 days; `null` for older events and
                            once it expired. What the browser claims, not a
                            verified device.
                  nextCursor:
                    type:
                      - "null"
                      - string
                    description: Cursor of the next page, for the `cursor` parameter; `null` on the
                      last page.
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/team/invites/{id}/resend:
    post:
      operationId: resendTeamInvite
      summary: Email a pending invite again
      tags:
        - team
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - id
                  - email
                  - role
                  - status
                  - createdAt
                  - expiresAt
                  - resendCount
                  - lastSentAt
                  - createdBy
                  - delivery
                properties:
                  id:
                    type: string
                  email:
                    type: string
                  role:
                    type: string
                    enum:
                      - admin
                      - viewer
                  status:
                    type: string
                    enum:
                      - created
                      - simulated
                      - accepted
                      - revoked
                      - expired
                  createdAt:
                    type: string
                    format: date-time
                  expiresAt:
                    type: string
                    format: date-time
                  resendCount:
                    type: integer
                    minimum: 0
                  lastSentAt:
                    type:
                      - "null"
                      - string
                    format: date-time
                  createdBy:
                    type: string
                    description: Email of the admin that created the invite.
                  delivery:
                    type: object
                    additionalProperties: false
                    required:
                      - state
                      - attempts
                      - lastAttemptAt
                      - failure
                    properties:
                      state:
                        type: string
                        enum:
                          - pending
                          - simulated
                          - sent
                          - failed
                        description: "Last send of the invite: `pending` while it runs, or when it was
                          cut short; `simulated` when no email was sent; `sent`
                          when the email provider accepted the message; `failed`
                          when it refused it or did not answer after the
                          retries."
                      attempts:
                        type: integer
                        minimum: 0
                      lastAttemptAt:
                        type:
                          - "null"
                          - string
                        format: date-time
                      failure:
                        type:
                          - "null"
                          - string
                        enum:
                          - rejected
                          - rate_limited
                          - unavailable
                          - network
                          - null
                        description: Cause of a `failed` delivery; `null` otherwise.
                    description: Delivery of the last email of the invite, from its creation or its
                      last resend.
