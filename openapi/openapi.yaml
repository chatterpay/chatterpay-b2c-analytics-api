  /v1/admin/networks:
    get:
      operationId: listAdminNetworks
      summary: Every network of the catalog with its analytics visibility
      tags:
        - admin
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - revision
                  - updatedAt
                  - networks
                properties:
                  revision:
                    type: integer
                    minimum: 0
                    description: Revision of the visibility policy; send it back as
                      expectedRevision.
                  updatedAt:
                    type:
                      - "null"
                      - string
                    format: date-time
                  networks:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                        - id
                        - chainId
                        - label
                        - family
                        - analyticsEnabled
                        - b2cEnabled
                        - sourcePresent
                        - tokens
                      properties:
                        id:
                          type: string
                          pattern: ^(?!all$)[a-z0-9]+(-[a-z0-9]+)*$
                          maxLength: 64
                        chainId:
                          type: string
                          pattern: ^[0-9]{1,30}$
                        label:
                          type: string
                        family:
                          type: string
                          enum:
                            - evm
                            - cardano
                        analyticsEnabled:
                          type: boolean
                          description: Whether the statistics of the analytics include the network.
                        b2cEnabled:
                          type:
                            - "null"
                            - boolean
                          description: "enabled of the B2C document: whether B2C accepts new operations on
                            the network. Informative only; null when the
                            document has no such field or B2C no longer lists
                            the network."
                        sourcePresent:
                          type: boolean
                          description: false for a network the B2C database no longer lists, kept by the
                            analytics for its history.
                        tokens:
                          type: array
                          items:
                            type: object
                            additionalProperties: false
                            required:
                              - id
                              - symbol
                              - address
                              - native
                              - stable
                              - b2cEnabled
                              - sourcePresent
                              - analyticsEnabled
                              - explorerUrl
                              - effectiveEnabled
                            properties:
                              id:
                                type: string
                                pattern: ^[0-9]{1,30}:(native|0x[0-9a-f]{40}|[0-9a-f]{56,120}|symbol:[A-Z0-9._-]{1,32})$
                                description: chainId:address in lower case, chainId:native for the native coin,
                                  chainId:symbol:SYMBOL without an address.
                              symbol:
                                type: string
                              address:
                                type: string
                                description: Public contract address; empty without one.
                              native:
                                type: boolean
                              stable:
                                type: boolean
                              b2cEnabled:
                                type:
                                  - "null"
                                  - boolean
                                description: enabled of the B2C token document. Informative only; null when the
                                  document has no such field.
                              sourcePresent:
                                type: boolean
                                description: false for a token the B2C database no longer lists, kept for its
                                  history and its preference.
                              analyticsEnabled:
                                type: boolean
                                description: Preference of the token itself; hiding its network does not change
                                  it.
                              explorerUrl:
                                type:
                                  - "null"
                                  - string
                                description: Token page in the network explorer; null for the native coin, a
                                  token without address or a network without
                                  explorer.
                              effectiveEnabled:
                                type: boolean
                                description: "Whether the statistics include the token: false when it or its
                                  network is hidden. A hidden token stays
                                  included while another token of the network
                                  with the same symbol is shown, because their
                                  operations are recorded by symbol."
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
