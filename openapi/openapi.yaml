                        enum:
                          - all
                          - base
                          - cardano
                      range:
                        type: string
                        enum:
                          - today
                          - week
                          - month
                          - year
                          - ytd
                          - all
                      period:
                        type: object
                        additionalProperties: false
                        required:
                          - start
                          - end
                        properties:
                          start:
                            type: string
                            format: date-time
                          end:
                            type: string
                            format: date-time
                      previousPeriod:
                        anyOf:
                          - type: object
                            additionalProperties: false
                            required:
                              - start
                              - end
                            properties:
                              start:
                                type: string
                                format: date-time
                              end:
                                type: string
                                format: date-time
                          - type: "null"
                      bucket:
                        type: string
                        enum:
                          - hour
                          - day
                          - month
                          - year
                  tiles:
                    type: object
                    additionalProperties: false
                    required:
                      - feesUsd
                      - transferFeesUsd
                      - swapFeesUsd
                      - volumeUsd
                    properties:
                      feesUsd:
                        type: object
                        additionalProperties: false
