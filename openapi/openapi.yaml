  /v1/admin/networks:
    get:
      operationId: listAdminNetworks
      summary: Every network of the catalog with its analytics visibility
      tags:
        - admin
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - revision
                  - updatedAt
                  - networks
                properties:
                  revision:
                    type: integer
                    minimum: 0
                    description: Revision of the visibility policy; send it back as
                      expectedRevision.
                  updatedAt:
                    type:
                      - "null"
                      - string
                    format: date-time
                  networks:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                        - id
                        - chainId
                        - label
                        - family
                        - analyticsEnabled
                        - b2cEnabled
                        - sourcePresent
                      properties:
                        id:
                          type: string
                          pattern: ^(?!all$)[a-z0-9]+(-[a-z0-9]+)*$
                          maxLength: 64
                        chainId:
                          type: string
                          pattern: ^[0-9]{1,30}$
                        label:
                          type: string
                        family:
                          type: string
                          enum:
                            - evm
                            - cardano
                        analyticsEnabled:
                          type: boolean
                          description: Whether the statistics of the analytics include the network.
                        b2cEnabled:
                          type:
                            - "null"
                            - boolean
                          description: "enabled of the B2C document: whether B2C accepts new operations on
                            the network. Informative only; null when the
                            document has no such field or B2C no longer lists
                            the network."
                        sourcePresent:
