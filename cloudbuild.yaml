steps:
  #
  # Writes the trigger substitutions to .env so the Build step can turn them into build arguments.
  # Only non-secret settings belong here; secrets are injected by Cloud Run (see Build).
  #
  - name: "gcr.io/cloud-builders/npm"
    id: CreateEnv
    args: ["run", "create-env"]
    env:
      - LOG_LEVEL=${_LOG_LEVEL}
      - BODY_LIMIT_BYTES=${_BODY_LIMIT_BYTES}
      - REQUEST_TIMEOUT_MS=${_REQUEST_TIMEOUT_MS}
      - JWT_KEY_ID=${_JWT_KEY_ID}
      - JWT_ISSUER=${_JWT_ISSUER}
      - JWT_AUDIENCE=${_JWT_AUDIENCE}
      - SESSION_TTL_MINUTES=${_SESSION_TTL_MINUTES}
      - CHALLENGE_TTL_MINUTES=${_CHALLENGE_TTL_MINUTES}
      - ALLOW_IN_MEMORY_STORE=${_ALLOW_IN_MEMORY_STORE}

  - name: "gcr.io/cloud-builders/docker"
    id: Build
    # The --build-arg list is assembled in bash from the .env that CreateEnv left behind, and the
    # names come from the Dockerfile's own ARG lines, so a new variable only has to be declared in
    # CreateEnv and in the Dockerfile. An empty value counts as unset and the API applies its default.
    #
    # Secrets are skipped. Cloud Run injects them into the service through secretKeyRef and that
    # value overrides the image's ENV; baking them in would leave the access code and the JWT
    # signing key in clear inside the registry. The bootstrap emails are personal data and are set
    # on the service as well. A new secret goes on the Cloud Run service and on this list, never
    # into CreateEnv.
    entrypoint: bash
    args:
      - "-c"
      - |
        set -euo pipefail
        secrets=' DEMO_ACCESS_CODE JWT_PRIVATE_KEY BOOTSTRAP_ADMIN_EMAILS BOOTSTRAP_VIEWER_EMAILS '
        build_args=()
        for name in $$(awk '/^ARG /{print $$2}' Dockerfile); do case "$$secrets" in *" $$name "*) continue;; esac; build_args+=(--build-arg "$$name=$$(sed -n "s/^$$name=//p" .env | head -n 1)"); done
        echo "assembled $$(( $${#build_args[@]} / 2 )) build args"
        docker build --no-cache -f Dockerfile "$${build_args[@]}" -t '$_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA' .

  - name: "gcr.io/cloud-builders/docker"
    id: Push
    args:
      - "push"
      - "$_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA"

  - name: "gcr.io/cloud-builders/gcloud"
    id: Deploy
    # Egress leaves through the Cloud NAT of the service's environment, whose reserved IP is the one
    # Mongo Atlas allows. The network is derived from the service name so the same file serves
    # develop and main without trigger substitutions; a name outside these patterns stops the build.
    #
    # The API is private: --no-allow-unauthenticated makes Cloud Run require an identity token with
    # roles/run.invoker, which only the site's service account holds. --max-instances 1 is required
    # while members and sessions live in the in-memory store; a second instance would not see them.
    entrypoint: bash
    args:
      - "-c"
      - |
        set -euo pipefail
        case '$_SERVICE_NAME' in
          *-main) network=chatterpay-main-vpc; subnet=chatterpay-main-run ;;
          *-develop) network=chatterpay-dev-vpc; subnet=chatterpay-dev-run ;;
          *) echo "no VPC egress mapping for service $_SERVICE_NAME" >&2; exit 1 ;;
        esac
        gcloud run deploy '$_SERVICE_NAME' --platform managed --region '$_DEPLOY_REGION' --image '$_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA' --labels 'managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID,gcb-trigger-id=$_TRIGGER_ID' --network "$$network" --subnet "$$subnet" --vpc-egress all-traffic --max-instances 1 --quiet --no-allow-unauthenticated

images:
  - $_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
