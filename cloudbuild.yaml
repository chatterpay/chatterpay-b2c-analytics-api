steps:
  - name: "gcr.io/cloud-builders/docker"
    id: Build
    # The image carries no environment settings. Every server variable, secret or not, is defined
    # on the Cloud Run service YAML; secrets come from Secret Manager through secretKeyRef.
    args:
      - "build"
      - "--no-cache"
      - "-f"
      - "Dockerfile"
      - "-t"
      - "$_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    id: Push
    args:
      - "push"
      - "$_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA"

  - name: "gcr.io/cloud-builders/gcloud"
    id: Deploy
    # Egress leaves through the Cloud NAT of the service's environment, whose reserved IP is the one
    # Mongo Atlas allows. The network is derived from the service name so the same file serves
    # develop and main without trigger substitutions; a name outside these patterns stops the build.
    #
    # The API is private: --no-allow-unauthenticated makes Cloud Run require an identity token with
    # roles/run.invoker, which only the site's service account holds. The token audience is the API
    # domain, declared as a custom audience on the service, because the site reaches the API
    # through the load balancer.
    #
    # The deploy sets only the image, labels and network, so the variables defined on the service
    # are carried over to the new revision.
    entrypoint: bash
    args:
      - "-c"
      - |
        set -euo pipefail
        case '$_SERVICE_NAME' in
          *-main) network=chatterpay-main-vpc; subnet=chatterpay-main-run ;;
          *-develop) network=chatterpay-dev-vpc; subnet=chatterpay-dev-run ;;
          *) echo "no VPC egress mapping for service $_SERVICE_NAME" >&2; exit 1 ;;
        esac
        gcloud run deploy '$_SERVICE_NAME' --platform managed --region '$_DEPLOY_REGION' --image '$_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA' --labels 'managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID,gcb-trigger-id=$_TRIGGER_ID' --network "$$network" --subnet "$$subnet" --vpc-egress all-traffic --quiet --no-allow-unauthenticated

images:
  - $_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
